<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central Records Database</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#eef2f5;
    font-family:'Roboto',sans-serif;
    color:#222;
}

.header{
    background:#1d3557;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.container{
    max-width:420px;
    margin:50px auto;
    background:white;
    border:1px solid #cfd8dc;
    border-radius:6px;
    padding:25px;
}

h2{
    margin-top:0;
    color:#1d3557;
}

p{
    color:#555;
}

label{
    font-weight:500;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:18px;
    border:1px solid #b0bec5;
    border-radius:4px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#1d3557;
    color:white;
    border:none;
    border-radius:4px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#27496d;
}

#message{
    margin-top:20px;
    color:#b00020;
    font-weight:500;
}

.footer{
    margin-top:35px;
    font-size:12px;
    color:#777;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">
CENTRAL RECORDS DATABASE
</div>

<div class="container">

<h2>Record Search</h2>

<p>Enter a Record ID to retrieve an archived file.</p>

<label>Record ID</label>

<input
id="code"
type="text"
placeholder="Example: REC-0001">

<button onclick="checkCode()">
Search
</button>

<p id="message"></p>

<div class="footer">
Archive System v2.6.4<br>
Authorised Personnel Only
</div>

</div>

<script>

function checkCode(){

const code=document.getElementById("code").value.trim().toUpperCase();

switch(code){

case "PIZZA1":
window.location.href="pizza1.html";
break;

case "PIZZA2":
window.location.href="pizza2.html";
break;

case "PIZZA3":
window.location.href="pizza3.html";
break;

default:
document.getElementById("message").textContent="No record found.";
}

}

document.getElementById("code").addEventListener("keypress",function(e){
if(e.key==="Enter"){
checkCode();
}
});

</script>

</body>
</html>
