<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G.F.M.F. Internal Database</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0d1117;
color:#e6edf3;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#161b22;
border:1px solid #30363d;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 40px rgba(0,0,0,.45);
}

.header{
padding:24px;
border-bottom:1px solid #30363d;
}

.logo{
font-size:34px;
font-weight:700;
letter-spacing:4px;
}

.name{
margin-top:8px;
font-size:13px;
color:#8b949e;
line-height:1.5;
}

.content{
padding:24px;
}

.section{
font-size:13px;
text-transform:uppercase;
letter-spacing:2px;
color:#8b949e;
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
}

input{
width:100%;
padding:14px;
background:#0d1117;
border:1px solid #30363d;
border-radius:6px;
color:white;
font-size:15px;
outline:none;
}

input:focus{
border-color:#58a6ff;
}

button{
width:100%;
margin-top:18px;
padding:14px;
background:#21262d;
border:1px solid #30363d;
color:white;
border-radius:6px;
font-size:15px;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#30363d;
}

#message{
margin-top:20px;
font-size:14px;
color:#c9d1d9;
min-height:20px;
}

.footer{
margin-top:30px;
padding-top:20px;
border-top:1px solid #30363d;
font-size:12px;
line-height:1.8;
color:#8b949e;
}

.status{
color:#3fb950;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
G.F.M.F.
</div>

<div class="name">
Government Funded Monster Federation<br>
Internal Records Network
</div>

</div>

<div class="content">

<div class="section">
RECORD DATABASE
</div>

<label>Record Identifier</label>

<input
id="code"
type="text"
placeholder="Enter Record ID">

<button onclick="checkCode()">
SEARCH
</button>

<p id="message"></p>

<div class="footer">

STATUS:
<span class="status">ONLINE</span><br>

CLASSIFICATION:
CONFIDENTIAL<br>

CLEARANCE:
LEVEL III<br>

DATABASE VERSION:
12.7.4

</div>

</div>

</div>

<script>

function checkCode(){

const code=document.getElementById("code").value.trim().toUpperCase();

const message=document.getElementById("message");

switch(code){

case "PIZZA1":

message.innerHTML="Searching records...";

setTimeout(()=>{
window.location.href="pizza1.html";
},1800);

break;

case "PIZZA2":

message.innerHTML="Searching records...";

setTimeout(()=>{
window.location.href="pizza2.html";
},1800);

break;

case "PIZZA3":

message.innerHTML="Searching records...";

setTimeout(()=>{
window.location.href="pizza3.html";
},1800);

break;

default:

message.innerHTML="No record found.";

}

}

document.getElementById("code").addEventListener("keydown",function(e){
if(e.key==="Enter"){
checkCode();
}
});

</script>

</body>
</html>
