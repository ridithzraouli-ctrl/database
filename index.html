<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.F.M.F. Access Terminal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0a0a;
    color:#e6e6e6;
    font-family:'JetBrains Mono', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.015) 0px,
        rgba(255,255,255,.015) 1px,
        transparent 2px,
        transparent 4px
    );
}

.container{
    width:600px;
    max-width:92%;
    background:#111;
    border:1px solid #2b2b2b;
    border-radius:10px;
    padding:40px;
    box-shadow:0 0 35px rgba(255,0,0,.08);
}

.logo{
    text-align:center;
    color:#c40000;
    font-size:42px;
    font-weight:bold;
    letter-spacing:12px;
    margin-bottom:30px;
    text-shadow:0 0 18px rgba(196,0,0,.45);
}

.subtitle{
    color:#777;
    text-align:center;
    margin-bottom:35px;
    font-size:14px;
    letter-spacing:2px;
}

label{
    display:block;
    margin-bottom:10px;
    color:#aaa;
}

input{
    width:100%;
    background:#0b0b0b;
    color:#fff;
    border:1px solid #333;
    padding:14px;
    font-family:inherit;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#c40000;
    box-shadow:0 0 10px rgba(196,0,0,.25);
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:#181818;
    color:white;
    border:1px solid #444;
    font-family:inherit;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    border-color:#c40000;
    background:#202020;
}

#error{
    margin-top:20px;
    color:#c40000;
    text-align:center;
    display:none;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#666;
    font-size:12px;
    letter-spacing:2px;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">G.F.M.F.</div>

<div class="subtitle">
ACCESS TERMINAL
</div>

<label>ENTER ACCESS CODE</label>

<input
type="text"
id="code"
placeholder="access code..."
autocomplete="off"
>

<button onclick="checkCode()">
VERIFY
</button>

<div id="error">
ACCESS DENIED
</div>

<div class="footer">
AUTHORIZED PERSONNEL ONLY
</div>

</div>

<script>

const codes = {

"missing-report-8":"https://ridithzraouli-ctrl.github.io/tag-entity/",
"pizza2":"https://youtube.com",
"pizza3":"https://youtube.com",
"pizza4":"https://youtube.com",
"pizza5":"https://youtube.com",
"pizza6":"https://youtube.com",
"pizza7":"https://youtube.com",
"pizza8":"https://youtube.com",
"pizza9":"https://youtube.com",
"pizza10":"https://youtube.com"

};

function checkCode(){

const input=document.getElementById("code").value.trim().toLowerCase();

if(codes[input]){
    window.location.href=codes[input];
}
else{
    document.getElementById("error").style.display="block";
}

}

document.getElementById("code").addEventListener("keydown",function(e){

if(e.key==="Enter"){
checkCode();
}

});

</script>

</body>
</html>
